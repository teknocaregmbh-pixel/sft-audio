name: Make Heart audio

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch:         # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Get the audio that is already online
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin audio >/dev/null; then
            git fetch --depth=1 origin audio
            git archive FETCH_HEAD | tar -x -C site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Voice model (cached)
        uses: actions/cache@v4
        with:
          path: model
          key: kokoro-v1.0

      - name: Download voice model if needed
        run: |
          mkdir -p model
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s model/kokoro-v1.0.onnx ] || curl -fsSL -o model/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -s model/voices-v1.0.bin ]  || curl -fsSL -o model/voices-v1.0.bin  $base/voices-v1.0.bin

      - name: Make audio
        id: make
        run: python generate.py

      - name: Publish (branch "audio" = GitHub Pages)
        if: steps.make.outputs.changed == 'true'
        run: |
          cd site
          git init -q -b audio
          git config user.name "sft-audio bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Audio $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audio
